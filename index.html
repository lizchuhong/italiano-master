<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b87820"><link rel="manifest" href="manifest.webmanifest"><title>Italiano Master</title><style>body{margin:0;background:#fff9ee;color:#3b3022;font:16px system-ui}header{padding:24px;background:#f5dfaa;text-align:center}main{max-width:850px;margin:auto;padding:16px}.card{background:white;padding:20px;border:1px solid #e7d8bd;border-radius:18px;margin:12px 0}button,select,textarea{font:inherit}button{border:0;border-radius:12px;background:#98601a;color:white;padding:11px 14px;margin:4px;cursor:pointer}nav button{background:#fff;color:#805114}input,textarea,select{padding:10px;border-radius:8px;border:1px solid #cabca7;max-width:95%}textarea{width:95%;min-height:110px}small{color:#766852}progress{width:100%} .list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.list .card{margin:0} .sub{color:#5c5144}</style></head><body><header><h1>🇮🇹 Italiano Master</h1><p>Giao tiếp · Du lịch · SEO · Marketing</p><nav><button onclick="home()">Giáo trình</button><button onclick="speaking()">Luyện nói</button><button onclick="flash()">Flashcards</button><button onclick="notes()">Ghi chú</button><button onclick="progressView()">Tiến độ</button></nav></header><main id="root"></main><script src="lessons.js"></script><script>
const root=document.getElementById('root'),lessons=window.LESSONS;let done=JSON.parse(localStorage.getItem('italiano-done')||'{}'),current=0;function say(s){if(!window.speechSynthesis)return alert('Không hỗ trợ đọc tiếng');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='it-IT';u.rate=.85;speechSynthesis.speak(u)}function home(){let modules=[...new Set(lessons.map(l=>l.module))];root.innerHTML='<h2>Giáo trình '+lessons.length+' bài</h2><p class="sub">Mỗi bài: nghe mẫu, từ mới, luyện nói và kiểm tra. Học 5–15 phút mỗi lần.</p><p>Hoàn thành '+Object.keys(done).length+'/'+lessons.length+' bài</p><progress value="'+Object.keys(done).length+'" max="'+lessons.length+'"></progress><p><input id="search" placeholder="Tìm bài học..." oninput="filter()"></p><div id="catalog">'+modules.map(m=>'<h3>'+m+'</h3><div class="list">'+lessons.map((l,i)=>l.module===m?'<div class="card" data-name="'+(l.title+' '+m).toLowerCase()+'"><small>'+l.cat+'</small><h3>'+l.title+'</h3><p>'+(done[i]?'✅ Đã học':'Chưa học')+'</p><button onclick="lesson('+i+')">Học bài</button></div>':'').join('')+'</div>').join('')+'</div>'}function filter(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('[data-name]').forEach(e=>e.style.display=e.dataset.name.includes(q)?'':'none')}function lesson(i){current=i;let l=lessons[i];let options=[l.meaning,'Không phải nghĩa của từ này','Một cách diễn đạt khác'];root.innerHTML='<div class="card"><small>'+l.module+'</small><h2>'+l.title+'</h2><h3 lang="it">'+l.it+'</h3><p>'+l.vi+'</p><button onclick="say(lessons[current].it)">🔊 Nghe câu mẫu</button><h3>Từ khóa: '+l.word+'</h3><p>Hãy nghe và đọc lại câu mẫu ít nhất hai lần.</p><h3>Kiểm tra: “'+l.word+'” nghĩa là gì?</h3>'+options.map((o,j)=>'<p><button onclick="check('+j+')">'+o+'</button></p>').join('')+'<p id="feedback" aria-live="polite"></p><button onclick="speaking()">Luyện nói</button><button onclick="home()">Danh sách bài</button></div>'}function check(j){let ok=j===0;document.getElementById('feedback').textContent=ok?'Đúng! Đã lưu bài hoàn thành.':'Chưa đúng, hãy thử lại.';if(ok){done[current]=true;localStorage.setItem('italiano-done',JSON.stringify(done))}}function flash(){let i=Math.floor(Math.random()*lessons.length),l=lessons[i];root.innerHTML='<div class="card"><h2>Flashcards</h2><h3>'+l.word+'</h3><button onclick="document.getElementById(\'translation\').hidden=false">Lật thẻ</button><p id="translation" hidden>'+l.meaning+' — '+l.it+'</p><button onclick="flash()">Thẻ tiếp theo</button></div>'}function speaking(){root.innerHTML='<div class="card"><h2>🎙️ Luyện nói</h2><select id="pick" onchange="sample()">'+lessons.map((l,i)=>'<option value="'+i+'" '+(i===current?'selected':'')+'>'+l.title+'</option>').join('')+'</select><p id="sample"></p><button onclick="say(lessons[Number(document.getElementById(\'pick\').value)].it)">Nghe mẫu</button><button onclick="record()">Bắt đầu / dừng ghi âm</button><p id="status"></p><audio id="audio" controls></audio><p class="sub">Ghi âm để tự nghe lại; chưa có AI chấm phát âm. Cần HTTPS và quyền microphone.</p></div>';sample()}function sample(){document.getElementById('sample').textContent=lessons[Number(document.getElementById('pick').value)].it}let recorder,stream,chunks=[];async function record(){try{if(recorder&&recorder.state==='recording'){recorder.stop();return}stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{document.getElementById('audio').src=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));stream.getTracks().forEach(t=>t.stop());document.getElementById('status').textContent='Đã ghi âm, hãy nghe lại.'};recorder.start();document.getElementById('status').textContent='Đang ghi âm...'}catch(e){alert('Không thể dùng microphone: '+e.message)}}function notes(){root.innerHTML='<div class="card"><h2>Sổ tay</h2><textarea id="note"></textarea><p><button onclick="localStorage.setItem(\'italiano-notes\',document.getElementById(\'note\').value);alert(\'Đã lưu trên thiết bị\')">Lưu</button></p></div>';document.getElementById('note').value=localStorage.getItem('italiano-notes')||''}function progressView(){root.innerHTML='<div class="card"><h2>Tiến độ</h2><p>'+Object.keys(done).length+'/'+lessons.length+' bài</p><progress value="'+Object.keys(done).length+'" max="'+lessons.length+'"></progress><p class="sub">Lưu trên thiết bị này; chưa đồng bộ tài khoản.</p></div>'}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
