<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b87820"><link rel="manifest" href="manifest.webmanifest"><title>Italiano Master</title><style>body{font:16px system-ui;background:#fff9ec;color:#33291d;margin:0}header{background:#f3d48a;padding:24px;text-align:center}main{max-width:800px;margin:auto;padding:16px}.card{background:white;border:1px solid #ead8b2;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 15px #70440010}button,select,textarea{font:inherit}button{border:0;background:#a76514;color:white;padding:12px 16px;border-radius:12px;margin:5px;cursor:pointer}button:focus{outline:3px solid #e7b94d}textarea{width:95%;min-height:100px;padding:10px}nav{display:flex;flex-wrap:wrap;justify-content:center}nav button{background:#fff;color:#75450c}small{color:#625c54}.muted{color:#695c4a}</style><header><h1>🇮🇹 Italiano Master</h1><p>Italian Communication · Tourism · SEO · Marketing</p><nav><button onclick="page('lessons')">Bài học</button><button onclick="page('speaking')">Luyện nói</button><button onclick="page('notes')">Sổ tay</button><button onclick="page('progress')">Tiến độ</button></nav></header><main id="root"></main><script>
const lessons=[{title:"Chào hỏi khách du lịch",cat:"Giao tiếp",it:"Buongiorno! Benvenuti ad Hanoi.",vi:"Chào buổi sáng! Chào mừng quý khách đến Hà Nội.",q:"Benvenuti nghĩa là gì?",a:["Tạm biệt","Chào mừng","Xin lỗi"],correct:1},{title:"Giới thiệu bản thân",cat:"Giao tiếp",it:"Mi chiamo Linh e sono la vostra guida.",vi:"Tôi tên Linh và là hướng dẫn viên của quý khách.",q:"Mi chiamo nghĩa là gì?",a:["Tôi tên là","Tôi đến từ","Tôi muốn"],correct:0},{title:"Hồ Hoàn Kiếm",cat:"Tourism",it:"Questo è il lago Hoan Kiem, nel cuore di Hanoi.",vi:"Đây là hồ Hoàn Kiếm, ở trung tâm Hà Nội.",q:"Lago nghĩa là gì?",a:["Đền","Hồ","Phố"],correct:1},{title:"Phố cổ Hà Nội",cat:"Tourism",it:"Il quartiere antico è famoso per le sue strade.",vi:"Khu phố cổ nổi tiếng với những con phố.",q:"Quartiere antico nghĩa là gì?",a:["Phố cổ","Bảo tàng","Chợ đêm"],correct:0},{title:"Viết tiêu đề SEO",cat:"SEO",it:"Scopri Hanoi in tre giorni: itinerario e consigli.",vi:"Khám phá Hà Nội trong ba ngày: lịch trình và lời khuyên.",q:"Scopri nghĩa là gì?",a:["Khám phá","Đặt vé","Nghỉ ngơi"],correct:0},{title:"Quảng bá city tour",cat:"Marketing",it:"Prenota un tour autentico di Hanoi con una guida locale.",vi:"Đặt tour Hà Nội chân thực với hướng dẫn viên địa phương.",q:"Prenota nghĩa là gì?",a:["Đọc","Đặt trước","Đi bộ"],correct:1}];
let done=JSON.parse(localStorage.getItem('italiano-done')||'{}');let idx=0;const root=document.getElementById('root');function speak(s){if(!('speechSynthesis'in window))return alert('Trình duyệt không hỗ trợ đọc tiếng.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='it-IT';u.rate=.85;speechSynthesis.speak(u)}function page(p){if(p==='lessons'){root.innerHTML='<h2>Học theo phiên 5–15 phút</h2>'+lessons.map((l,i)=>'<div class="card"><small>'+l.cat+'</small><h3>'+l.title+'</h3><p>'+(done[i]?'✅ Đã hoàn thành':'Chưa hoàn thành')+'</p><button onclick="openLesson('+i+')">Vào bài học</button></div>').join('')}if(p==='speaking')root.innerHTML='<div class="card"><h2>🎙️ Speaking Lab</h2><p>Chọn bài học, nghe mẫu rồi ghi âm giọng nói của bạn. Ghi âm chỉ được giữ trong phiên này.</p><select id="sel">'+lessons.map((l,i)=>'<option value="'+i+'">'+l.title+'</option>').join('')+'</select><p id="sample"></p><button onclick="sample()">Nghe mẫu</button><button onclick="record()">Bắt đầu / dừng ghi âm</button><p id="recstatus"></p><audio id="playback" controls></audio><p class="muted">Chức năng này chưa tự động chấm phát âm. Micro cần HTTPS và quyền truy cập.</p></div>';sample()}if(p==='notes'){root.innerHTML='<div class="card"><h2>📒 Sổ tay</h2><textarea id="notes" placeholder="Ghi chú từ mới và câu nói..."></textarea><p><button onclick="localStorage.setItem(\'italiano-notes\',document.getElementById(\'notes\').value);alert(\'Đã lưu trên thiết bị\')">Lưu ghi chú</button></p></div>';document.getElementById('notes').value=localStorage.getItem('italiano-notes')||''}if(p==='progress'){root.innerHTML='<div class="card"><h2>Tiến độ</h2><p>Đã hoàn thành '+Object.keys(done).length+'/'+lessons.length+' bài</p><progress value="'+Object.keys(done).length+'" max="'+lessons.length+'"></progress><p class="muted">Tiến độ lưu trên thiết bị này; chưa đồng bộ giữa các máy.</p></div>'}}function openLesson(i){idx=i;let l=lessons[i];root.innerHTML='<div class="card"><small>'+l.cat+'</small><h2>'+l.title+'</h2><h3 lang="it">'+l.it+'</h3><p>'+l.vi+'</p><button onclick="speak(lessons[idx].it)">🔊 Nghe tiếng Ý</button><h3>'+l.q+'</h3>'+l.a.map((x,j)=>'<p><button onclick="answer('+j+')">'+x+'</button></p>').join('')+'<p id="feedback"></p><button onclick="page(\'lessons\')">Quay lại</button></div>'}function answer(j){let ok=j===lessons[idx].correct;document.getElementById('feedback').textContent=ok?'Chính xác! Đã lưu tiến độ.':'Chưa đúng, thử lại nhé.';if(ok){done[idx]=true;localStorage.setItem('italiano-done',JSON.stringify(done))}}function sample(){let l=lessons[Number(document.getElementById('sel').value)];document.getElementById('sample').textContent=l.it;speak(l.it)}let recorder,stream,chunks=[];async function record(){try{if(recorder&&recorder.state==='recording'){recorder.stop();return}stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));document.getElementById('playback').src=url;stream.getTracks().forEach(t=>t.stop());document.getElementById('recstatus').textContent='Đã ghi âm. Nhấn Play để nghe lại.'};recorder.start();document.getElementById('recstatus').textContent='Đang ghi âm, nhấn lần nữa để dừng.'}catch(e){alert('Không truy cập được microphone: '+e.message)}}page('lessons');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
