:root{--bg:#fffaf0;--ink:#352a20;--gold:#b88728;--gold-light:#f9eac3;--muted:#6b6256;--line:#e8dcc5}*{box-sizing:border-box}body{font:16px/1.62 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);margin:0}header{background:linear-gradient(115deg,#fff1c7,#f7d98e);padding:24px 16px;border-bottom:1px solid #e5c57a}header>div,main{max-width:1050px;margin:auto}h1{font-size:clamp(1.5rem,4vw,2.35rem);margin:0}h2{line-height:1.3}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button,.btn{background:#9a681c;color:white;border:0;border-radius:11px;padding:10px 14px;font:inherit;cursor:pointer;display:inline-block;text-decoration:none}button:hover,.btn:hover{background:#754b12}button:focus-visible,a:focus-visible{outline:3px solid #ddaa38;outline-offset:2px}.secondary{background:#f4e6c7;color:#523d20}.secondary:hover{background:#ead49f}main{padding:20px 14px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #5d41100a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.grid .card{margin:0}.muted,small{color:var(--muted)}.eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#8a611c;font-weight:700}.lesson-nav{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.lesson-nav button{padding:7px 10px}.lesson-nav .active{background:#523915;color:white}.block{margin:12px 0}.subheading{font-weight:700;color:#694512;margin:15px 0 5px}.bullet{padding-left:18px;position:relative}.bullet:before{content:'•';position:absolute;left:2px;color:var(--gold)}.number{padding-left:14px}.tablewrap{overflow-x:auto;margin:15px 0}table{border-collapse:collapse;width:100%;font-size:.94rem}th,td{border:1px solid #e3d8c4;padding:9px;text-align:left;vertical-align:top;min-width:115px}th{background:#fff1d0}tr:nth-child(even){background:#fffaf0}textarea,input{width:100%;padding:11px;font:inherit;border:1px solid #cfc1a9;border-radius:9px;background:white}textarea{min-height:130px}label{display:block;font-weight:650;margin:10px 0 5px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}progress{width:100%;height:12px;accent-color:#a67821}.pill{display:inline-block;background:#f8e9c6;color:#674716;padding:4px 10px;border-radius:99px;font-size:.8rem}.video{border-left:3px solid #d4a645;padding:9px 12px;margin:8px 0;background:#fff9eb;overflow-wrap:anywhere}a{color:#855514}details{background:#fff9ec;border-radius:10px;padding:10px 13px;margin:10px 0}summary{cursor:pointer;font-weight:700}audio{width:100%;max-width:480px}.alert{background:#fff0d0;padding:12px;border-radius:10px}.reviewrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}@media(max-width:560px){.card{padding:14px}header{padding:18px 12px}nav button{flex:1}th,td{min-width:130px}}

</style><link rel="stylesheet" href="./study-style.css"></head><body><header><div><div class="eyebrow">Italian Tourism · SEO · Marketing Intensive 2026</div><h1>🇮🇹 Italiano Master</h1><div>Tourism Academy — giáo trình nguyên bản tháng 10/2026</div><nav><button onclick="home()">58 bài học</button><button onclick="plan()">Lộ trình & kiểm tra</button><button onclick="reviews()">Ôn tập D1–D30</button><button onclick="errors()">I miei errori</button><button onclick="notes()">Sổ tay</button><button onclick="progressView()">Tiến độ</button></nav></div></header><main id="root"></main><script src="curriculum.js"></script><script src="./italian-deep-practice.js"></script><script>
const DATA=window.CURRICULUM,root=document.getElementById('root'),lessons=DATA.lessons;const KEY='italiano-intensive-2026-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{state={}}state.done||={};state.started||={};state.notes||={};state.errors||=[];let current=0,section=0,recorder=null,stream=null,chunks=[];const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtDate=d=>new Date(d).toLocaleDateString('vi-VN');function say(s){if(!('speechSynthesis'in window))return alert('Thiết bị không hỗ trợ đọc mẫu.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='it-IT';u.rate=.82;speechSynthesis.speak(u)}function buttons(){return '<div class="controls"><button class="secondary" onclick="home()">← Danh sách</button><button class="secondary" onclick="openLesson('+Math.max(0,current-1)+')">Bài trước</button><button class="secondary" onclick="openLesson('+Math.min(lessons.length-1,current+1)+')">Bài tiếp</button></div>'}function home(){root.innerHTML='<h2>Giáo trình tháng 10 — 58 bài: 18 gốc + 40 mở rộng</h2><p class="muted">Không gộp 5 chủ đề thành một bài. Mỗi bài giữ nguyên 14 phần của tài liệu: mục tiêu, ngữ pháp, từ vựng, phát âm, video, speaking, reading, role-play, bài tập, đáp án, hội thoại, homework, lịch ôn và error log.</p><div class="grid">'+lessons.map(l=>'<div class="card"><div class="eyebrow">Lesson '+l.number+'</div><h3>'+esc(l.title)+'</h3><p><span class="pill">'+(state.done[l.number]?'Đã hoàn thành':'Chưa hoàn thành')+'</span></p><button onclick="openLesson('+ (l.number-1)+')">Mở bài học</button></div>').join('')+'</div><p class="muted">40 bài tháng 11–12 được biên soạn mới theo KPI đã duyệt; phân biệt với 18 bài gốc tháng 10.</p>'}function openLesson(i,sec=0){current=i;section=sec;state.started[lessons[i].number]||=new Date().toISOString().slice(0,10);save();renderLesson()}function renderLesson(){let l=lessons[current],s=l.sections[section];root.innerHTML=buttons()+'<div class="card"><div class="eyebrow">Lesson '+l.number+' / 58</div><h2>'+esc(l.title)+'</h2><div class="lesson-nav">'+l.sections.map((v,i)=>'<button class="secondary '+(i===section?'active':'')+'" onclick="section='+i+';renderLesson()">'+(i+1)+'. '+esc(v.title.replace(/^\d+\.\s*/,''))+'</button>').join('')+'</div><div class="eyebrow">Phần '+(section+1)+' / '+l.sections.length+'</div><h2>'+esc(s.title)+'</h2>'+renderBlocks(s.blocks,section===9||section===10)+'</div>'+((section===5||section===7||section===11)?'<div class="card"><h3>🎙️ Luyện nói và tự nghe lại</h3><p>Vòng 1: nói không nhìn mẫu. Vòng 2: tự ghi lại 3–5 lỗi. Vòng 3: nói lại từ đầu, không đọc bản sửa.</p><div class="controls"><button onclick="record()" id="recbtn">Bắt đầu ghi âm</button><span id="recstatus" aria-live="polite"></span></div><audio id="playback" controls></audio><p class="muted">Bản ghi chỉ phát lại trong phiên hiện tại; chưa có chấm phát âm bằng AI.</p></div>':'')+'<div class="card"><label for="work">Bài làm / ghi chú riêng của phần này</label><textarea id="work" placeholder="Viết câu trả lời, bản dịch, bài SEO hoặc các chunks cần nhớ..."></textarea><div class="controls"><button onclick="saveWork()">Lưu bài làm</button><button class="secondary" onclick="section=Math.max(0,section-1);renderLesson()">← Phần trước</button><button class="secondary" onclick="section=Math.min(lessons[current].sections.length-1,section+1);renderLesson()">Phần tiếp →</button></div><p id="saved" aria-live="polite"></p></div><div class="card"><label><input type="checkbox" id="completed" style="width:auto" '+(state.done[l.number]?'checked':'')+' onchange="markDone(this.checked)"> Tôi đã hoàn thành bài, luyện nói lại và lưu output bắt buộc</label><small>Đánh dấu thủ công; ứng dụng không tự coi bài đã đạt chỉ vì mở trang.</small></div>';document.getElementById('work').value=state.notes['lesson-'+l.number+'-'+section]||''}function renderBlocks(blocks,hidden){let html='';let tableIndex=0;for(let b of blocks){if(b.type==='table'){let rows=b.rows;html+='<div class="tablewrap"><table>'+rows.map((row,i)=>'<tr>'+row.map(c=>'<'+(i?'td':'th')+'>'+esc(c)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table></div>';tableIndex++;continue}let t=b.text;let v=t.match(/https?:\/\/\S+/);if(v){let url=v[0].replace(/[),.;]+$/,'');if(/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(url)){html+='<div class="video">'+esc(t.slice(0,v.index)).replace(/\s*[—–-]\s*$/,'')+'<p><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">▶ Xem video gốc trên YouTube</a></p></div>';continue}}let klass=b.type==='subheading'?'subheading':b.type==='bullet'?'bullet':b.type==='number'?'number':'block';html+='<div class="'+klass+'">'+esc(t).replace(/\n/g,'<br>')+'</div>'}return hidden?'<details><summary>Mở nội dung mẫu / đáp án — chỉ xem sau khi tự làm</summary>'+html+'</details>':html}function saveWork(){state.notes['lesson-'+lessons[current].number+'-'+section]=document.getElementById('work').value;save();document.getElementById('saved').textContent='Đã lưu trên thiết bị này.'}function markDone(yes){state.done[lessons[current].number]=yes;save()}async function record(){let status=document.getElementById('recstatus'),btn=document.getElementById('recbtn');if(recorder?.state==='recording'){recorder.stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType});document.getElementById('playback').src=URL.createObjectURL(blob);stream.getTracks().forEach(t=>t.stop());status.textContent='Đã ghi xong. Hãy nghe lại và ghi lỗi.';btn.textContent='Ghi âm lại'};recorder.start();status.textContent='Đang ghi âm…';btn.textContent='Dừng ghi âm'}catch(e){status.textContent='Không thể dùng micro: '+e.message}}function plan(){let blocks=DATA.overview;root.innerHTML='<h2>Master Study Plan & phương pháp</h2><div class="card">'+blocks.map(b=>b.style==='table'?renderBlocks([{type:'table',rows:b.rows}]):b.style.startsWith('Heading')?'<h3>'+esc(b.text)+'</h3>':'<p>'+esc(b.text)+'</p>').join('')+'</div><h2>Weekly Tests & October Exam</h2>'+DATA.appendices.map(a=>'<div class="card"><h3>'+esc(a.title)+'</h3>'+a.sections.map((s,i)=>'<details><summary>'+esc(s.title)+'</summary>'+renderBlocks(s.blocks)+'</details>').join('')+'</div>').join('')}function reviews(){let days=[1,2,4,7,14,30],today=new Date();today.setHours(0,0,0,0);let tasks=[];for(let l of lessons){let start=state.started[l.number];if(!start)continue;let base=new Date(start+'T00:00:00');let sec=l.sections.find(s=>s.title.includes('Review Schedule'));let guide=sec?.blocks.map(b=>b.text).join(' ')||'';for(let d of days){let due=new Date(base);due.setDate(due.getDate()+d);if(due<=today)tasks.push({l,d,due,guide})}}tasks.sort((a,b)=>a.due-b.due);root.innerHTML='<h2>Ôn tập cách quãng D1 → D2 → D4 → D7 → D14 → D30</h2><p>Ngày ôn được tính từ lần đầu mở bài. Recall trước khi xem đáp án; mỗi lần 5–15 phút.</p>'+(!tasks.length?'<div class="card">Hãy mở bài học đầu tiên để bắt đầu lịch ôn.</div>':tasks.map(t=>'<div class="card reviewrow"><div><b>Bài '+t.l.number+' · D'+t.d+'</b> — '+esc(t.l.title)+'<br><small>Đến hạn: '+fmtDate(t.due)+' · '+esc(t.guide)+'</small></div><button onclick="openLesson('+(t.l.number-1)+',12)">Ôn bài</button></div>').join(''))}function errors(){root.innerHTML='<h2>I miei errori — Error Log</h2><p>Ghi lỗi thật, cách sửa, quy tắc và câu mới. Mỗi tuần chọn 5 lỗi lặp lại để luyện tập.</p><div class="card"><label>Lỗi gốc</label><textarea id="wrong" placeholder="Errare..."></textarea><label>Câu sửa đúng</label><textarea id="right"></textarea><label>Loại lỗi / quy tắc / câu mới</label><textarea id="rule"></textarea><button onclick="addError()">Lưu lỗi</button></div>'+state.errors.map((e,i)=>'<div class="card"><small>'+esc(e.date)+'</small><p><b>Lỗi:</b> '+esc(e.wrong)+'</p><p><b>Sửa:</b> '+esc(e.right)+'</p><p>'+esc(e.rule)+'</p><button class="secondary" onclick="state.errors.splice('+i+',1);save();errors()">Xóa</button></div>').join('')}function addError(){let wrong=document.getElementById('wrong').value.trim(),right=document.getElementById('right').value.trim(),rule=document.getElementById('rule').value.trim();if(!wrong||!right)return alert('Hãy nhập lỗi và câu sửa.');state.errors.unshift({wrong,right,rule,date:new Date().toISOString().slice(0,10)});save();errors()}function notes(){root.innerHTML='<h2>Sổ tay tổng hợp</h2><div class="card"><textarea id="general" placeholder="Ghi lại các chunks quan trọng..."></textarea><p><button onclick="state.notes.general=document.getElementById(\'general\').value;save();alert(\'Đã lưu\')">Lưu sổ tay</button></p></div>';document.getElementById('general').value=state.notes.general||''}function progressView(){let n=Object.values(state.done).filter(Boolean).length;root.innerHTML='<h2>Tiến độ toàn khóa</h2><div class="card"><h2>'+n+' / 58 bài</h2><progress value="'+n+'" max="58"></progress><p>Đã bắt đầu '+Object.keys(state.started).length+' bài · '+state.errors.length+' lỗi trong Error Log</p><p class="muted">Dữ liệu lưu trong trình duyệt trên thiết bị hiện tại. Chưa có đồng bộ giữa điện thoại và máy tính; không xóa dữ liệu trình duyệt nếu muốn giữ tiến độ.</p><button class="secondary" onclick="exportData()">Xuất dữ liệu học tập (.json)</button><label>Khôi phục dữ liệu đã xuất</label><input type="file" accept="application/json" onchange="importData(this)"></div>'}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='italiano-master-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importData(el){let f=el.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x||typeof x!=='object'||!x.done||!x.notes)throw Error('Sai định dạng');if(!confirm('Thay dữ liệu hiện tại bằng bản sao lưu?'))return;state=x;state.errors||=[];state.started||={};save();progressView()}catch(e){alert('Không đọc được dữ liệu: '+e.message)}}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script src="./study-upgrade.js"></script></body></html>
