<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b87820"><link rel="manifest" href="manifest.webmanifest"><title>Italiano Master · Học theo bài</title><style>body{font:16px system-ui;margin:0;background:#fff9ed;color:#382b1c}header{background:#f4dfab;text-align:center;padding:22px}main{max-width:900px;margin:auto;padding:16px}nav button{background:#fff;color:#84521b}.card{background:white;border:1px solid #e8d9bd;border-radius:17px;padding:19px;margin:12px 0}button{border:0;border-radius:11px;padding:11px 14px;background:#985f17;color:#fff;margin:4px;cursor:pointer}button:focus-visible{outline:3px solid #e5af55}small,.muted{color:#6d604f}h3{margin-bottom:7px}progress{width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.grid .card{margin:0}textarea{width:95%;min-height:110px;font:inherit;padding:10px;border:1px solid #cdbfa8;border-radius:9px}audio{max-width:100%}.lessonbar{display:flex;gap:6px;flex-wrap:wrap}.lessonbar button{background:#e9d8b6;color:#4a3217}.lessonbar button.active{background:#985f17;color:#fff}</style></head><body><header><h1>🇮🇹 Italiano Master</h1><p>Học theo bài lớn · Từ nền tảng đến du lịch, SEO và marketing</p><nav><button onclick="home()">Giáo trình</button><button onclick="flash()">Flashcards</button><button onclick="notes()">Sổ tay</button><button onclick="progressView()">Tiến độ</button></nav></header><main id="root"></main><script src="lessons.js"></script><script>
const root=document.getElementById('root'),items=window.LESSONS,groups=[];let done=JSON.parse(localStorage.getItem('italiano-done')||'{}'),active=0,step=0,answers={};for(let i=0;i<items.length;i+=5)groups.push({module:items[i].module,items:items.slice(i,i+5),start:i});function say(s){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='it-IT';u.rate=.85;speechSynthesis.speak(u)}function count(g){return g.items.filter((_,i)=>done[g.start+i]).length}function home(){root.innerHTML='<h2>13 bài học tổng hợp</h2><p>Mỗi bài gồm 5 chủ đề liên quan, ví dụ tiếng Ý, giải thích, luyện nghe, luyện nói và kiểm tra cuối bài.</p><div class="grid">'+groups.map((g,i)=>'<div class="card"><small>'+g.module+'</small><h3>Bài '+(i+1)+': '+g.items[0].title+' – '+g.items[g.items.length-1].title+'</h3><p>'+g.items.map(x=>x.title).join(' · ')+'</p><p>Đã học '+count(g)+'/5 phần</p><progress value="'+count(g)+'" max="5"></progress><p><button onclick="openLesson('+i+')">Vào bài học</button></p></div>').join('')+'</div>'}function openLesson(i){active=i;step=0;answers={};render()}function render(){let g=groups[active],l=g.items[step];root.innerHTML='<div class="card"><small>'+g.module+'</small><h2>Bài '+(active+1)+': '+g.items[0].title+' – '+g.items[4].title+'</h2><p><strong>Mục tiêu:</strong> Nắm vững '+g.items.map(x=>x.title.toLowerCase()).join(', ')+'.</p><h3>Nội dung trong bài</h3><div class="lessonbar">'+g.items.map((x,i)=>'<button class="'+(i===step?'active':'')+'" onclick="step='+i+';render()">'+(i+1)+'. '+x.title+'</button>').join('')+'</div></div><div class="card"><small>Phần '+(step+1)+'/5 · Học và thực hành</small><h2>'+l.title+'</h2><h3 lang="it">'+l.it+'</h3><p>'+l.vi+'</p><p><b>Từ vựng:</b> '+l.word+' = '+l.meaning+'</p><p><b>Cách luyện:</b> Nghe mẫu, nhắc lại hai lần và thay một từ để tạo câu mới.</p><button onclick="say(items[groups[active].start+step].it)">🔊 Nghe mẫu</button><h3>Kiểm tra hiểu bài</h3><p>“'+l.word+'” nghĩa là gì?</p><div id="options"></div><p id="feedback" aria-live="polite"></p><button onclick="record()">🎙️ Ghi âm / dừng</button><p id="status"></p><audio controls id="playback"></audio><p class="muted">Tự nghe lại giọng nói; chưa có AI chấm phát âm.</p></div><div class="card"><button onclick="home()">Danh sách bài</button><button onclick="step=Math.max(0,step-1);render()">Phần trước</button><button onclick="step=Math.min(4,step+1);render()">Phần tiếp</button><button onclick="review()">Ôn tập cuối bài</button></div>';let choices=[l.meaning,'Nghĩa của một từ khác','Không liên quan'];let order=[1,0,2];document.getElementById('options').innerHTML=order.map(j=>'<button data-choice="'+j+'">'+choices[j]+'</button>').join('');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let ok=Number(b.dataset.choice)===0;document.getElementById('feedback').textContent=ok?'Đúng! Đã ghi nhận phần này.':'Chưa đúng, hãy xem lại từ vựng.';if(ok){done[g.start+step]=true;localStorage.setItem('italiano-done',JSON.stringify(done))}})}function review(){let g=groups[active];root.innerHTML='<div class="card"><h2>Ôn tập · Bài '+(active+1)+'</h2><p>Đọc lại 5 câu, nghe mẫu và tự nói lại ý nghĩa tiếng Việt.</p>'+g.items.map((l,i)=>'<p><b>'+(i+1)+'. '+l.title+'</b>: <span lang="it">'+l.it+'</span> <button data-say="'+i+'">🔊</button></p>').join('')+'<p>Đã hoàn thành '+count(g)+'/5 phần. Hãy quay lại các phần chưa đạt.</p><button onclick="openLesson('+active+')">Học lại bài</button><button onclick="home()">Danh sách bài</button></div>';document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(g.items[Number(b.dataset.say)].it))}let recorder,stream,chunks=[];async function record(){try{if(recorder&&recorder.state==='recording'){recorder.stop();return}stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{document.getElementById('playback').src=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));stream.getTracks().forEach(t=>t.stop());document.getElementById('status').textContent='Đã ghi âm; nghe lại để tự đánh giá.'};recorder.start();document.getElementById('status').textContent='Đang ghi âm...'}catch(e){alert('Không mở được microphone: '+e.message)}}function flash(){let i=Math.floor(Math.random()*items.length),l=items[i];root.innerHTML='<div class="card"><h2>Flashcards</h2><h3>'+l.word+'</h3><button onclick="document.getElementById(\'answer\').hidden=false">Lật thẻ</button><p id="answer" hidden>'+l.meaning+' — '+l.it+'</p><button onclick="flash()">Thẻ khác</button></div>'}function notes(){root.innerHTML='<div class="card"><h2>Sổ tay</h2><textarea id="note"></textarea><p><button onclick="localStorage.setItem(\'italiano-notes\',document.getElementById(\'note\').value);alert(\'Đã lưu\')">Lưu</button></p></div>';document.getElementById('note').value=localStorage.getItem('italiano-notes')||''}function progressView(){root.innerHTML='<div class="card"><h2>Tiến độ học tập</h2><p>'+Object.keys(done).length+'/'+items.length+' phần hoàn thành</p><progress value="'+Object.keys(done).length+'" max="'+items.length+'"></progress><p>Tiến độ cũ được giữ lại. Dữ liệu chỉ lưu trên thiết bị này.</p></div>'}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
