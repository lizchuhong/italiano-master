ound:white}textarea{min-height:130px}label{display:block;font-weight:650;margin:10px 0 5px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}progress{width:100%;height:12px;accent-color:#a67821}.pill{display:inline-block;background:#f8e9c6;color:#674716;padding:4px 10px;border-radius:99px;font-size:.8rem}.video{border-left:3px solid #d4a645;padding:9px 12px;margin:8px 0;background:#fff9eb;overflow-wrap:anywhere}a{color:#855514}details{background:#fff9ec;border-radius:10px;padding:10px 13px;margin:10px 0}summary{cursor:pointer;font-weight:700}audio{width:100%;max-width:480px}.alert{background:#fff0d0;padding:12px;border-radius:10px}.reviewrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}@media(max-width:560px){.card{padding:14px}header{padding:18px 12px}nav button{flex:1}th,td{min-width:130px}}

</style><link rel="stylesheet" href="./study-style.css"><link rel="stylesheet" href="./learning-plus.css"><link rel="stylesheet" href="./guided-flow.css?v=17"></head><body data-academy="italian"><header class="site-header"></header><main id="root"></main><script src="curriculum.js"></script><script src="./italian-deep-practice.js"></script><script src="./verified-italian-lessons.js?v=16"></script><script>
const DATA=window.CURRICULUM,root=document.getElementById('root'),lessons=DATA.lessons;const KEY='italiano-intensive-2026-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{state={}}state.done||={};state.started||={};state.notes||={};state.errors||=[];let current=0,recorder=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtDate=d=>new Date(d).toLocaleDateString('vi-VN');function say(text, rate, onError) {
  if (!('speechSynthesis' in window)) {
    onError();
    return;
  }
  const sample = new SpeechSynthesisUtterance(text);
  sample.lang = 'it-IT';
  sample.rate = rate;
  const voice = speechSynthesis.getVoices().find(item => /^it(?:[-_]|$)/i.test(item.lang));
  if (voice) sample.voice = voice;
  sample.onerror = event => {
    if (!['canceled', 'interrupted'].includes(event.error)) onError();
  };
  speechSynthesis.cancel();
  speechSynthesis.speak(sample);
}function renderBlocks(blocks,hidden){let html='';let tableIndex=0;for(const [i,b] of blocks.entries()){if(b.type==='table'){let rows=b.rows;html+='<div class="tablewrap"><table>'+rows.map((row,i)=>'<tr>'+row.map(c=>'<'+(i?'td':'th')+'>'+esc(c)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table></div>';tableIndex++;continue}let t=b.text;let v=t.match(/https?:\/\/\S+/);if(v){let url=v[0].replace(/[),.;]+$/,'');if(/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(url)){html+='<div class="video">'+esc(t.slice(0,v.index)).replace(/\s*[—–-]\s*$/,'')+'<p><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">▶ Xem video gốc trên YouTube</a></p></div>';continue}}let klass=b.type==='subheading'?'subheading':b.type==='bullet'?'bullet':b.type==='number'?'number':'block';html+='<div data-block-index="'+i+'" class="'+klass+'">'+esc(t).replace(/\n/g,'<br>')+'</div>'}return hidden?'<details><summary>Mở nội dung mẫu / đáp án — chỉ xem sau khi tự làm</summary>'+html+'</details>':html}async function record() {
  if (recorder?.state === 'recording') {
    recorder.stop();
    return;
  }

  const status = document.getElementById('recstatus');
  const button = document.getElementById('recbtn');
  const playback = document.getElementById('playback');
  if (!playback || button.disabled) return;
  button.disabled = true;
  let input;
  try {
    input = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (!playback.isConnected) {
      input.getTracks().forEach(track => track.stop());
      return;
    }
    const session = new MediaRecorder(input);
    const chunks = [];
    session.ondataavailable = event => chunks.push(event.data);
    session.onstop = () => {
      input.getTracks().forEach(track => track.stop());
      if (recorder !== session || !playback.isConnected) return;
      if (playback.src) URL.revokeObjectURL(playback.src);
      playback.src = URL.createObjectURL(new Blob(chunks, { type: session.mimeType }));
      status.textContent = 'Đã ghi xong. Hãy nghe lại và ghi lỗi.';
      button.textContent = 'Ghi âm lại';
    };
    session.start();
    recorder = session;
    status.textContent = 'Đang ghi âm…';
    button.textContent = 'Dừng ghi âm';
  } catch (error) {
    input?.getTracks().forEach(track => track.stop());
    status.textContent = 'Không thể dùng micro: ' + error.message;
  } finally {
    button.disabled = false;
  }
}
function plan(){let blocks=DATA.overview;root.innerHTML='<h2>Master Study Plan & phương pháp</h2><div class="card">'+blocks.map(b=>b.style==='table'?renderBlocks([{type:'table',rows:b.rows}]):b.style.startsWith('Heading')?'<h3>'+esc(b.text)+'</h3>':'<p>'+esc(b.text)+'</p>').join('')+'</div><h2>Weekly Tests & October Exam</h2>'+DATA.appendices.map(a=>'<div class="card"><h3>'+esc(a.title)+'</h3>'+a.sections.map((s,i)=>'<details><summary>'+esc(s.title)+'</summary>'+renderBlocks(s.blocks)+'</details>').join('')+'</div>').join('')}function reviews(){let days=[1,2,4,7,14,30],today=new Date();today.setHours(0,0,0,0);let tasks=[];for(let l of lessons){let start=state.started[l.number];if(!start)continue;let base=new Date(start+'T00:00:00');let sec=l.sections.find(s=>s.title.includes('Review Schedule'));let guide=sec?.blocks.map(b=>b.text).join(' ')||'';for(let d of days){let due=new Date(base);due.setDate(due.getDate()+d);if(due<=today)tasks.push({l,d,due,guide})}}tasks.sort((a,b)=>a.due-b.due);root.innerHTML='<h2>Ôn tập cách quãng D1 → D2 → D4 → D7 → D14 → D30</h2><p>Ngày ôn được tính từ lần đầu mở bài. Recall trước khi xem đáp án; mỗi lần 5–15 phút.</p>'+(!tasks.length?'<div class="card">Hãy mở bài học đầu tiên để bắt đầu lịch ôn.</div>':tasks.map(t=>'<div class="card reviewrow"><div><b>Bài '+t.l.number+' · D'+t.d+'</b> — '+esc(t.l.title)+'<br><small>Đến hạn: '+fmtDate(t.due)+' · '+esc(t.guide)+'</small></div><button onclick="openLesson('+(t.l.number-1)+',12)">Ôn bài</button></div>').join(''))}function errors(){root.innerHTML='<h2>I miei errori — Error Log</h2><p>Ghi lỗi thật, cách sửa, quy tắc và câu mới. Mỗi tuần chọn 5 lỗi lặp lại để luyện tập.</p><div class="card"><label>Lỗi gốc</label><textarea id="wrong" placeholder="Errare..."></textarea><label>Câu sửa đúng</label><textarea id="right"></textarea><label>Loại lỗi / quy tắc / câu mới</label><textarea id="rule"></textarea><button onclick="addError()">Lưu lỗi</button></div>'+state.errors.map((e,i)=>'<div class="card"><small>'+esc(e.date)+'</small><p><b>Lỗi:</b> '+esc(e.wrong)+'</p><p><b>Sửa:</b> '+esc(e.right)+'</p><p>'+esc(e.rule)+'</p><button class="secondary" onclick="state.errors.splice('+i+',1);save();errors()">Xóa</button></div>').join('')}function addError(){let wrong=document.getElementById('wrong').value.trim(),right=document.getElementById('right').value.trim(),rule=document.getElementById('rule').value.trim();if(!wrong||!right)return alert('Hãy nhập lỗi và câu sửa.');state.errors.unshift({wrong,right,rule,date:new Date().toISOString().slice(0,10)});save();errors()}function notes(){root.innerHTML='<h2>Sổ tay tổng hợp</h2><div class="card"><textarea id="general" placeholder="Ghi lại các chunks quan trọng..."></textarea><p><button onclick="state.notes.general=document.getElementById(\'general\').value;save();alert(\'Đã lưu\')">Lưu sổ tay</button></p></div>';document.getElementById('general').value=state.notes.general||''}function progressView(){let n=Object.values(state.done).filter(Boolean).length;root.innerHTML='<h2>Tiến độ toàn khóa</h2><div class="card"><h2>'+n+' / 58 bài</h2><progress value="'+n+'" max="58"></progress><p>Đã bắt đầu '+Object.keys(state.started).length+' bài · '+state.errors.length+' lỗi trong Error Log</p><p class="muted">Dữ liệu lưu trong trình duyệt trên thiết bị hiện tại. Chưa có đồng bộ giữa điện thoại và máy tính; không xóa dữ liệu trình duyệt nếu muốn giữ tiến độ.</p><button class="secondary" onclick="exportData()">Xuất dữ liệu học tập (.json)</button><label>Khôi phục dữ liệu đã xuất</label><input type="file" accept="application/json" onchange="importData(this)"></div>'}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='italiano-master-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importData(el){let f=el.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x||typeof x!=='object'||!x.done||!x.notes)throw Error('Sai định dạng');if(!confirm('Thay dữ liệu hiện tại bằng bản sao lưu?'))return;state=x;state.errors||=[];state.started||={};save();progressView()}catch(e){alert('Không đọc được dữ liệu: '+e.message)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).catch(()=>{});
</script><script src="./study-upgrade.js?v=17"></script><script src="./travel-atlas.js"></script><script src="./learning-plus.js?v=17"></script><script src="./guided-flow.js?v=17"></script></body></html>
